[package]
name = "frigate-detector-rs"
version = "0.2.0"
edition = "2021"
description = "Threaded Rust detector — ncnn via subprocess + rayon post-process"

[[bin]]
name = "frigate-detector-rs"
path = "src/main.rs"

[dependencies]
crossbeam = "0.8"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
