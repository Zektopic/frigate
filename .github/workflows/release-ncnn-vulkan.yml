name: Release ncnn-vulkan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v0.17.4-vulkan or test)"
        required: true
        type: string
      platforms:
        description: "Comma-separated buildx platforms (linux/arm64 is experimental and untested on hardware)"
        required: false
        default: "linux/amd64"
        type: string

# only run the latest build per ref to avoid cache overwrites
concurrency:
  group: ncnn-vulkan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build & push ncnn-vulkan image
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU and Buildx
        id: setup
        uses: ./.github/actions/setup
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: lowercaseRepo
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository_owner }}

      - name: Resolve image tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "IMAGE_TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${{ inputs.tag }}" >> $GITHUB_ENV
          fi
          echo "IMAGE_NAME=ghcr.io/${{ steps.lowercaseRepo.outputs.lowercase }}/frigate-ncnn-vulkan" >> $GITHUB_ENV

      # releases also update :latest; manual test builds only push their tag
      - name: Assemble tag list
        run: |
          TAGS="${IMAGE_NAME}:${IMAGE_TAG}"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi
          echo "TAGS=${TAGS}" >> $GITHUB_ENV

      - name: Build and push ncnn-vulkan image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/ncnn-vulkan/Dockerfile
          push: true
          # releases stay amd64-only; manual runs may add linux/arm64
          platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'linux/amd64' }}
          tags: ${{ env.TAGS }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
