name: On pull request

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".github/*.yml"
      - ".github/DISCUSSION_TEMPLATE/**"
      - ".github/ISSUE_TEMPLATE/**"

env:
  DEFAULT_PYTHON: 3.11

jobs:
  rust_checks:
    name: Rust - Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add clippy
          # The acceleration crates carry scalar fallbacks so they must
          # keep building for non-x86 hosts (Raspberry Pi, RK3588, ARM
          # NAS boxes). Cross-checking aarch64 is what stops an
          # unguarded `use std::arch::x86_64` from landing again.
          rustup target add aarch64-unknown-linux-gnu
      - name: Build and test
        run: |
          set -eux
          for crate in frigate-detector-rs frigate-motion-rs frigate-yolo-rs frigate-frame-rs; do
            (cd "$crate" && cargo build --release && cargo test --release)
          done
      - name: Cross-check aarch64
        run: |
          set -eux
          for crate in frigate-motion-rs frigate-yolo-rs frigate-frame-rs; do
            (cd "$crate" && cargo check --release --target aarch64-unknown-linux-gnu)
          done
      - name: Clippy
        run: |
          set -eux
          # correctness lints are hard failures; style lints are advisory
          # until the existing backlog is cleared.
          for crate in frigate-detector-rs frigate-motion-rs frigate-yolo-rs frigate-frame-rs; do
            (cd "$crate" && cargo clippy --release --all-targets -- -D clippy::correctness)
          done

  web_lint:
    name: Web - Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm install
        working-directory: ./web
      - name: Lint
        run: npm run lint
        working-directory: ./web
      - name: Check i18n keys
        run: npm run i18n:extract:ci
        working-directory: ./web

  web_test:
    name: Web - Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm install
        working-directory: ./web
      - name: Build web
        run: npm run build
        working-directory: ./web
      # - name: Test
      #   run: npm run test
      #   working-directory: ./web

  web_e2e:
    name: Web - E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm install
        working-directory: ./web
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: ./web
      - name: Build web for E2E
        run: npm run e2e:build
        working-directory: ./web
      - name: Run E2E tests
        run: npm run e2e
        working-directory: ./web
      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7

  python_checks:
    runs-on: ubuntu-latest
    name: Python Checks
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Install requirements
        run: |
          python3 -m pip install -U pip
          python3 -m pip install -r docker/main/requirements-dev.txt
      - name: Check formatting
        run: |
          ruff format --check --diff frigate migrations docker *.py
      - name: Check lint
        run: |
          ruff check frigate migrations docker *.py

  python_tests:
    runs-on: ubuntu-latest
    name: Python Tests
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install devcontainer cli
        run: npm install --global @devcontainers/cli
      - name: Build devcontainer
        env:
          DOCKER_BUILDKIT: "1"
        run: devcontainer build --workspace-folder .
      - name: Start devcontainer
        run: devcontainer up --workspace-folder .
      - name: Run mypy in devcontainer
        run: devcontainer exec --workspace-folder . bash -lc "python3 -u -m mypy --config-file frigate/mypy.ini frigate"
      - name: Check API spec is up to date
        run: devcontainer exec --workspace-folder . bash -lc "python3 generate_api_auth_spec.py --check"
      - name: Run unit tests in devcontainer
        # Scoped to frigate/test rather than bare discovery from the
        # repo root: a stray root-level test_*.py (test_runner.py did
        # exactly this) gets imported by discovery and its sys.modules
        # patching of numpy/cv2/peewee/pydantic then poisons the whole
        # run.
        run: devcontainer exec --workspace-folder . bash -lc "python3 -u -m unittest discover -s frigate/test -t ."
